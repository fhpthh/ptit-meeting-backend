name: ptit-meeting-local

services:
  redis:
    image: redis:7.4-alpine
    container_name: ptit-meeting-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: ptit-meeting-livekit
    restart: unless-stopped
    command: ["--bind", "0.0.0.0"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 192.168.1.38
        redis:
          address: redis:6379
        keys:
          "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}": "${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}"
        webhook:
          api_key: "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}"
          urls:
            - "${LIVEKIT_WEBHOOK_URL:-http://host.docker.internal:8080/api/v1/integrations/livekit/webhook}"
    ports:
      - "127.0.0.1:7880:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://127.0.0.1:7880/ > /dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 15

  minio:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-10-26T00-00-00Z}
    container_name: ptit-meeting-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${RECORDING_STORAGE_ACCESS_KEY:?Set RECORDING_STORAGE_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${RECORDING_STORAGE_SECRET_KEY:?Set RECORDING_STORAGE_SECRET_KEY in .env}
      MINIO_API_CORS_ALLOW_ORIGIN: ${RECORDING_STORAGE_CORS_ALLOWED_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 15

  minio-init:
    image: ${MINIO_IMAGE:-pgsty/silo:RELEASE.2026-10-26T00-00-00Z}
    container_name: ptit-meeting-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      RECORDING_STORAGE_ACCESS_KEY: ${RECORDING_STORAGE_ACCESS_KEY:?Set RECORDING_STORAGE_ACCESS_KEY in .env}
      RECORDING_STORAGE_SECRET_KEY: ${RECORDING_STORAGE_SECRET_KEY:?Set RECORDING_STORAGE_SECRET_KEY in .env}
      RECORDING_STORAGE_BUCKET: ${RECORDING_STORAGE_BUCKET:-meeting-recordings}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mcli alias set local http://minio:9000 "$${RECORDING_STORAGE_ACCESS_KEY}" "$${RECORDING_STORAGE_SECRET_KEY}"
        mcli mb --ignore-existing "local/$${RECORDING_STORAGE_BUCKET}"
        mcli anonymous set download "local/$${RECORDING_STORAGE_BUCKET}"
    restart: "no"

volumes:
  redis_data:
  minio_data:
