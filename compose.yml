name: ptit-meeting-local

services:
  redis:
    image: redis:7.4-alpine
    container_name: ptit-meeting-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.13.10
    container_name: ptit-meeting-livekit
    restart: unless-stopped
    command: ["--bind", "0.0.0.0"]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: 127.0.0.1
          enable_loopback_candidate: true
        redis:
          address: redis:6379
        keys:
          "${LIVEKIT_API_KEY:?Set LIVEKIT_API_KEY in .env}": "${LIVEKIT_API_SECRET:?Set LIVEKIT_API_SECRET in .env}"
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881/tcp"
      - "127.0.0.1:7882:7882/udp"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:7880/ > /dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15

volumes:
  redis_data:
