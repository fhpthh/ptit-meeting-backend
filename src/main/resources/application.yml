spring:
  application:
    name: ptit-meeting-backend

  config:
    import: "optional:file:.env[.properties]"

  liquibase:
    enabled: ${LIQUIBASE_ENABLED:false}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ptit_meeting?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:24102004}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

azure:
  activedirectory:
    client-id: ${AZURE_AD_CLIENT_ID:}
    client-secret: ${AZURE_AD_CLIENT_SECRET:}
    tenant-id: common
    redirect-uri: ${AZURE_AD_REDIRECT_URI:http://localhost:3000/auth/callback}
    token-url: https://login.microsoftonline.com/${azure.activedirectory.tenant-id}/oauth2/v2.0/token
    graph-user-info-url: https://graph.microsoft.com/v1.0/me

application:
  livekit:
    enabled: ${LIVEKIT_ENABLED:true}
    api-url: ${LIVEKIT_API_URL:http://localhost:7880}
    websocket-url: ${LIVEKIT_WS_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:}
    api-secret: ${LIVEKIT_API_SECRET:}
    join-token-ttl-ms: ${LIVEKIT_JOIN_TOKEN_TTL_MS:600000}

  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
      refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}
  storage:
    type: LOCAL
    local:
      base-dir: ${UPLOAD_BASE_DIR:uploads}
    modules:
      timetable:
        sub-dir: timetables
        max-size-bytes: 26214400 # 25MB
        allowed-extensions: [ .xlsx, .xls ]
      avatar:
        sub-dir: avatars
        max-size-bytes: 5242880  # 5MB
        allowed-extensions: [ .png, .jpg, .jpeg ]
      document:
        sub-dir: documents
        max-size-bytes: 52428800 # 50MB
        allowed-extensions: [ .pdf, .docx, .pptx ]

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

  timetable:
    periods:
      # Ca sáng
      1: { start: "07:00", end: "07:50" }
      2: { start: "08:00", end: "08:50" }
      3: { start: "09:00", end: "09:50" }
      4: { start: "10:00", end: "10:50" }
      5: { start: "11:00", end: "11:50" }
      6: { start: "12:00", end: "12:50" }
      # Ca chiều
      7: { start: "13:00", end: "13:50" }
      8: { start: "14:00", end: "14:50" }
      9: { start: "15:00", end: "15:50" }
      10: { start: "16:00", end: "16:50" }
      11: { start: "17:00", end: "17:50" }
      12: { start: "18:00", end: "18:50" }
      # Ca tối
      13: { start: "19:00", end: "19:50" }
      14: { start: "20:00", end: "20:50" }
      15: { start: "21:00", end: "21:50" }
